# Node catalog: the schema the whole agent reasons over.
#
# `slots` is the shape of a workflow, in the order a request flows through it.
# A slot either lets the user choose a node of some kind (`choose`) or always
# holds one fixed node (`node`). Slot order is question order.
#
# `nodes` declares every node type. A param is required when `required: true`,
# or when `required_if` names a sibling param whose current value is listed.
# `aliases` map enum members (or selectable nodes) to the words a user might say;
# the grounding guard uses them to check a value against the text it came from.
# `state_row` names the collected-information row a node (or param) fills; the
# reference path keeps the brief's own wording. Without one, the generator falls
# back to the slot's display name.

slots:
  - id: trigger
    choose: trigger
    display: Trigger Source
    prompt_hint: which platform or event starts the workflow
  - id: filter
    node: condition
    display: Condition
  - id: action
    choose: action
    display: Notification Channel
    prompt_hint: where the notification or result should be sent
  - id: dedupe
    node: deduplicate
    display: Duplicate Handling

nodes:
  # ---------------------------------------------------------------- triggers
  gmail_trigger:
    kind: trigger
    label: Gmail Trigger
    state_row: "Trigger Source"
    display: Gmail
    aliases: [gmail, google mail, email, e-mail, mail]
    params:
      monitor_location:
        state_row: "Monitor Location"
        required: true
        display_suffix: (Label)
        prompt_hint: which Gmail label or folder to monitor
      only_unread: { required: false, default: true, enum: [true, false] }

  outlook_trigger:
    kind: trigger
    label: Outlook Trigger
    state_row: "Trigger Source"
    display: Outlook
    aliases: [outlook, office 365, microsoft mail, hotmail, email, e-mail, mail]
    params:
      monitor_location:
        state_row: "Monitor Location"
        required: true
        display_suffix: (Folder)
        prompt_hint: which Outlook folder to monitor
      only_unread: { required: false, default: true, enum: [true, false] }

  webhook_trigger:
    kind: trigger
    label: Webhook Trigger
    state_row: "Trigger Source"
    display: Webhook
    aliases: [webhook, web hook, http call, api call, incoming request]
    params:
      path: { state_row: "Webhook Path", required: true, prompt_hint: which URL path the webhook should listen on }
      method:
        required: false
        default: POST
        enum: [POST, GET]
        aliases: { POST: [post], GET: [get] }

  schedule_trigger:
    kind: trigger
    label: Schedule Trigger
    state_row: "Trigger Source"
    display: Schedule
    aliases: [schedule, scheduled, every hour, hourly, every day, daily, every morning, every week, weekly, cron]
    params:
      frequency:
        state_row: "Frequency"
        required: true
        enum: [hourly, daily, weekly]
        aliases:
          hourly: [hourly, every hour]
          daily: [daily, every day, every morning, every evening]
          weekly: [weekly, every week, every monday, every tuesday, every wednesday, every thursday, every friday, every saturday, every sunday]
        prompt_hint: how often the workflow should run (hourly, daily or weekly)
      time:
        state_row: "Run Time"
        required_if: { frequency: [daily, weekly] }
        prompt_hint: what time of day it should run
      day_of_week:
        state_row: "Run Day"
        required_if: { frequency: [weekly] }
        enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
        aliases:
          monday: [monday, mon]
          tuesday: [tuesday, tue]
          wednesday: [wednesday, wed]
          thursday: [thursday, thu]
          friday: [friday, fri]
          saturday: [saturday, sat]
          sunday: [sunday, sun]
        prompt_hint: which day of the week it should run

  google_sheets_trigger:
    kind: trigger
    label: Google Sheets Trigger
    state_row: "Trigger Source"
    display: Google Sheets
    aliases: [google sheets, google sheet, gsheets, sheets, spreadsheet, spreadsheets]
    params:
      spreadsheet:
        state_row: "Watched Spreadsheet"
        required: true
        display_suffix: (Spreadsheet)
        prompt_hint: which Google Sheets spreadsheet to watch for new rows
      sheet: { required: false }

  excel_trigger:
    kind: trigger
    label: Excel Trigger
    state_row: "Trigger Source"
    display: Excel
    aliases: [excel, microsoft excel, excel online, workbook, spreadsheet, spreadsheets]
    params:
      workbook:
        state_row: "Watched Workbook"
        required: true
        display_suffix: (Workbook)
        prompt_hint: which Excel workbook to watch for new rows
      worksheet: { required: false }

  google_forms_trigger:
    kind: trigger
    label: Google Forms Trigger
    state_row: "Trigger Source"
    display: Google Forms
    aliases: [google forms, google form, form, forms, form submission, form response]
    params:
      form:
        state_row: "Form"
        required: true
        display_suffix: (Form)
        prompt_hint: which Google Form to watch for new responses

  typeform_trigger:
    kind: trigger
    label: Typeform Trigger
    state_row: "Trigger Source"
    display: Typeform
    aliases: [typeform, form, forms, form submission, form response]
    params:
      form:
        state_row: "Form"
        required: true
        display_suffix: (Form)
        prompt_hint: which Typeform form to watch for new responses

  telegram_trigger:
    kind: trigger
    label: Telegram Trigger
    state_row: "Trigger Source"
    display: Telegram
    aliases: [telegram]
    params:
      chat:
        state_row: "Chat"
        required: true
        display_suffix: (Chat)
        prompt_hint: which Telegram chat or bot to listen to

  google_drive_trigger:
    kind: trigger
    label: Google Drive Trigger
    state_row: "Trigger Source"
    display: Google Drive
    aliases: [google drive, gdrive, drive]
    params:
      folder:
        state_row: "Watched Folder"
        required: true
        display_suffix: (Folder)
        prompt_hint: which Google Drive folder to watch for new files

  google_calendar_trigger:
    kind: trigger
    label: Google Calendar Trigger
    state_row: "Trigger Source"
    display: Google Calendar
    aliases: [google calendar, calendar, gcal]
    params:
      calendar:
        state_row: "Calendar"
        required: true
        display_suffix: (Calendar)
        prompt_hint: which Google Calendar to watch for new events
      minutes_before: { required: false }

  stripe_trigger:
    kind: trigger
    label: Stripe Trigger
    state_row: "Trigger Source"
    display: Stripe
    aliases: [stripe]
    params:
      event:
        state_row: "Stripe Event"
        required: true
        enum: [payment_succeeded, payment_failed, invoice_paid, subscription_created, subscription_cancelled]
        aliases:
          payment_succeeded: [successful payment, payment succeeded, payment received, new payment, charge succeeded]
          payment_failed: [failed payment, payment failed, payment fails, charge failed, declined payment]
          invoice_paid: [invoice paid, paid invoice]
          subscription_created: [new subscription, subscription created, new subscriber]
          subscription_cancelled: [cancelled subscription, subscription cancelled, canceled subscription, churn]
        prompt_hint: which Stripe event starts the workflow (a payment succeeding or failing, an invoice paid, or a subscription created or cancelled)

  shopify_trigger:
    kind: trigger
    label: Shopify Trigger
    state_row: "Trigger Source"
    display: Shopify
    aliases: [shopify]
    params:
      event:
        state_row: "Shopify Event"
        required: true
        enum: [order_created, order_paid, customer_created, product_updated]
        aliases:
          order_created: [new order, order placed, order created, orders]
          order_paid: [order paid, paid order]
          customer_created: [new customer, customer created, signup, sign up]
          product_updated: [product updated, product changes, stock change, inventory change]
        prompt_hint: which Shopify event starts the workflow (a new order, a paid order, a new customer, or a product update)
      store: { required: false }

  github_trigger:
    kind: trigger
    label: GitHub Trigger
    state_row: "Trigger Source"
    display: GitHub
    aliases: [github, git hub]
    params:
      repository:
        state_row: "Repository"
        required: true
        display_suffix: (Repository)
        prompt_hint: which GitHub repository to watch
      event:
        state_row: "Repository Event"
        required: true
        enum: [push, pull_request, issue, release]
        aliases:
          push: [push, pushes, commit, commits]
          pull_request: [pull request, pull requests, pr, prs]
          issue: [issue, issues, bug report]
          release: [release, releases, new version]
        prompt_hint: which GitHub event starts the workflow (a push, a pull request, an issue, or a release)

  rss_trigger:
    kind: trigger
    label: RSS Feed Trigger
    state_row: "Trigger Source"
    display: RSS Feed
    aliases: [rss, rss feed, feed, blog feed]
    params:
      feed_url:
        state_row: "Feed URL"
        required: true
        display_suffix: (Feed)
        prompt_hint: which RSS feed URL to watch for new items

  # ----------------------------------------------------------------- actions
  slack_notify:
    kind: action
    label: Slack Notification
    state_row: "Notification Channel"
    display: Slack
    aliases: [slack]
    params:
      channel: { state_row: "Channel / Recipient", required: true, prompt_hint: "which Slack channel to post in (and workspace, if there is more than one)" }
      workspace: { required: false }
      message: { required: false }

  email_send:
    kind: action
    label: Email Notification
    state_row: "Notification Channel"
    display: Email
    aliases: [email, e-mail, mail, send an email, email me]
    params:
      recipient: { state_row: "Recipient", required: true, prompt_hint: which email address should receive it }
      subject: { required: false }

  http_request:
    kind: action
    label: HTTP Request
    state_row: "Destination Service"
    display: HTTP Request
    aliases: [http request, webhook call, api, post request, call an api, call the api]
    params:
      url: { state_row: "Endpoint URL", required: true, prompt_hint: which URL to send the request to }
      method:
        state_row: "HTTP Method"
        required: true
        enum: [GET, POST, PUT]
        aliases: { GET: [get], POST: [post], PUT: [put] }
        prompt_hint: which HTTP method to use (GET, POST or PUT)

  teams_notify:
    kind: action
    label: Microsoft Teams Message
    state_row: "Notification Channel"
    display: Microsoft Teams
    aliases: [microsoft teams, ms teams, teams]
    params:
      team: { state_row: "Team", required: true, prompt_hint: which Microsoft Teams team to post in }
      channel: { state_row: "Channel", required: true, prompt_hint: which Teams channel to post in }
      message: { required: false }

  discord_notify:
    kind: action
    label: Discord Message
    state_row: "Notification Channel"
    display: Discord
    aliases: [discord]
    params:
      channel: { state_row: "Channel", required: true, prompt_hint: "which Discord channel to post in (and server, if there is more than one)" }
      server: { required: false }
      message: { required: false }

  telegram_send:
    kind: action
    label: Telegram Message
    state_row: "Notification Channel"
    display: Telegram
    aliases: [telegram]
    params:
      chat: { state_row: "Chat", required: true, prompt_hint: "which Telegram chat, group or channel to send the message to" }
      message: { required: false }

  whatsapp_send:
    kind: action
    label: WhatsApp Message
    state_row: "Notification Channel"
    display: WhatsApp
    aliases: [whatsapp, whats app]
    params:
      phone_number: { state_row: "Phone Number", required: true, prompt_hint: which WhatsApp phone number should receive the message }
      message: { required: false }

  sms_send:
    kind: action
    label: SMS (Twilio)
    state_row: "Notification Channel"
    display: SMS
    aliases: [sms, text message, text messages, twilio]
    params:
      phone_number: { state_row: "Phone Number", required: true, prompt_hint: which phone number should receive the text message }
      message: { required: false }

  google_sheets_append:
    kind: action
    label: Add Row to Google Sheets
    state_row: "Destination Spreadsheet App"
    display: Google Sheets
    aliases: [google sheets, google sheet, gsheets, sheets, spreadsheet, spreadsheets]
    params:
      spreadsheet: { state_row: "Spreadsheet", required: true, prompt_hint: which Google Sheets spreadsheet to add the row to }
      sheet: { required: false }

  excel_append:
    kind: action
    label: Add Row to Excel
    state_row: "Destination Spreadsheet App"
    display: Excel
    aliases: [excel, microsoft excel, excel online, workbook, spreadsheet, spreadsheets]
    params:
      workbook: { state_row: "Workbook", required: true, prompt_hint: which Excel workbook to add the row to }
      worksheet: { required: false }

  notion_create_page:
    kind: action
    label: Create Notion Page
    state_row: "Destination Workspace"
    display: Notion
    aliases: [notion]
    params:
      database: { state_row: "Database", required: true, prompt_hint: which Notion database the new page should go in }

  trello_create_card:
    kind: action
    label: Create Trello Card
    state_row: "Task Board"
    display: Trello
    aliases: [trello]
    params:
      board: { state_row: "Board", required: true, prompt_hint: which Trello board to add the card to }
      list: { state_row: "List", required: true, prompt_hint: which list on that Trello board the card should go in }

  jira_create_issue:
    kind: action
    label: Create Jira Issue
    state_row: "Issue Tracker"
    display: Jira
    aliases: [jira]
    params:
      project: { state_row: "Project", required: true, prompt_hint: which Jira project to create the issue in }
      issue_type:
        state_row: "Issue Type"
        required: true
        enum: [task, bug, story]
        aliases:
          task: [task, tasks]
          bug: [bug, bugs, defect]
          story: [story, stories, user story]
        prompt_hint: which kind of Jira issue to create (task, bug or story)

  airtable_create_record:
    kind: action
    label: Create Airtable Record
    state_row: "Destination Database"
    display: Airtable
    aliases: [airtable]
    params:
      base: { state_row: "Base", required: true, prompt_hint: which Airtable base to add the record to }
      table: { state_row: "Table", required: true, prompt_hint: which table in that Airtable base }

  asana_create_task:
    kind: action
    label: Create Asana Task
    state_row: "Task Manager"
    display: Asana
    aliases: [asana]
    params:
      project: { state_row: "Project", required: true, prompt_hint: which Asana project to create the task in }

  extract_fields:
    kind: action
    label: Extract Fields
    selectable: false
    params:
      fields: { required: false }

  # ------------------------------------------------------------------- logic
  filter_by_label:
    kind: logic
    label: Filter by Label
    selectable: false
    params:
      label: { required: true }

  condition:
    kind: logic
    label: Condition
    state_row: "Condition"
    params:
      mode:
        required: true
        enum: [all, filtered]
        aliases:
          all: [every, all, any, each, everything, no filter]
          filtered: [only, above, below, over, under, more than, less than, greater than, contains, containing, from]
        prompt_hint: whether every item should trigger the workflow, or only items matching a condition
      field:
        required_if: { mode: [filtered] }
        enum: [amount, subject, sender]
        aliases:
          amount: [amount, total, value, price, ₹, $, €, £, rs, inr, usd]
          subject: [subject, title]
          sender: [sender, from]
        prompt_hint: which field the condition checks (amount, subject or sender)
      operator:
        required_if: { mode: [filtered] }
        enum: [gt, lt, eq, contains]
        aliases:
          gt: [above, over, more than, greater than, exceeding, higher than, ">"]
          lt: [below, under, less than, lower than, "<"]
          eq: [equal to, equals, exactly, is]
          contains: [contains, containing, includes, including, mentions, from]
        prompt_hint: how the value should be compared
      value:
        required_if: { mode: [filtered] }
        prompt_hint: which value to compare against

  deduplicate:
    kind: logic
    label: Duplicate Handling
    state_row: "Duplicate Handling"
    params:
      enabled:
        required: true
        enum: [true, false]
        aliases:
          true: ["yes", yeah, yep, sure, ignore, ignore them, skip duplicates, ignore duplicates]
          false: ["no", nope, keep them, don't ignore, do not ignore, keep duplicates]
        prompt_hint: whether duplicate items should be ignored
