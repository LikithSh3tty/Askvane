# Lookup table for the stub provider.
#
# `extraction` maps a user utterance (matched case- and whitespace-insensitively)
# to what a model might read out of it. Values are always strings, exactly as a
# real provider returns them. Entries may name requirements that are not open
# yet, or claim things the user never said; the extractor and the grounding
# guard are what keep those out of the state.
#
# `question` maps a requirement id (optionally `id:node_type`) to a first ask and
# a rephrase for when the plain ask has already failed twice. `{item}` and
# `{items}` in an ask are filled with what the user said the workflow is about,
# taken from `subjects`; when they named none of those, `ask_generic` is used.

subjects:
  invoice: invoices
  receipt: receipts
  order: orders
  message: messages
  ticket: tickets
  lead: leads
  submission: submissions
  row: rows
  response: responses
  issue: issues
  payment: payments

ambiguity_template: 'When you say "{span}", do you mean {options}?'

extraction:
  # ------------------------------------------------ reference conversation
  "Whenever a new invoice arrives, notify my finance team.":
    extractions:
      # Both of these are hallucinations. The guard must reject them.
      - { requirement: action, value: slack_notify, span: notify my finance team }
      - { requirement: action.channel, value: "#finance", span: "#finance" }
  "Gmail":
    extractions:
      - { requirement: trigger, value: gmail_trigger, span: Gmail }
  "Finance":
    extractions:
      - { requirement: trigger.monitor_location, value: Finance, span: Finance }
  "Only above ₹10,000":
    extractions:
      - { requirement: filter.mode, value: filtered, span: Only above }
      - { requirement: filter.field, value: amount, span: "₹" }
      - { requirement: filter.operator, value: gt, span: above }
      - { requirement: filter.value, value: "10000", span: "₹10,000" }
  "Slack":
    extractions:
      - { requirement: action, value: slack_notify, span: Slack }
  "#finance channel":
    extractions:
      - { requirement: action.channel, value: "#finance", span: "#finance" }
  "Yes":
    extractions:
      - { requirement: dedupe.enabled, value: "true", span: "Yes" }

  # ------------------------------------------------ eval conversations
  "When a new message lands in my Outlook Invoices folder, email ap@acme.com":
    extractions:
      - { requirement: trigger, value: outlook_trigger, span: Outlook }
      - { requirement: trigger.monitor_location, value: Invoices, span: Invoices folder }
      - { requirement: action, value: email_send, span: email }
      - { requirement: action.recipient, value: ap@acme.com, span: ap@acme.com }
  "Every one of them":
    extractions:
      - { requirement: filter.mode, value: all, span: Every }
  "No":
    extractions:
      - { requirement: dedupe.enabled, value: "false", span: "No" }
  "When our webhook at /orders receives a call, forward it with a POST request to https://erp.example.com/api":
    extractions:
      - { requirement: trigger, value: webhook_trigger, span: webhook }
      - { requirement: trigger.path, value: /orders, span: /orders }
      - { requirement: action, value: http_request, span: POST request }
      - { requirement: action.url, value: "https://erp.example.com/api", span: "https://erp.example.com/api" }
      - { requirement: action.method, value: POST, span: POST }
  "all of them":
    extractions:
      - { requirement: filter.mode, value: all, span: all }
  "all":
    extractions:
      - { requirement: filter.mode, value: all, span: all }
  "Every day at 9am, post a summary to Slack in #daily":
    extractions:
      - { requirement: trigger, value: schedule_trigger, span: Every day }
      - { requirement: trigger.frequency, value: daily, span: Every day }
      - { requirement: trigger.time, value: 9am, span: 9am }
      - { requirement: action, value: slack_notify, span: Slack }
      - { requirement: action.channel, value: "#daily", span: "#daily" }
  "every time, no filter":
    extractions:
      - { requirement: filter.mode, value: all, span: no filter }
  "Run weekly and email reports@acme.com":
    extractions:
      - { requirement: trigger, value: schedule_trigger, span: weekly }
      - { requirement: trigger.frequency, value: weekly, span: weekly }
      - { requirement: action, value: email_send, span: email }
      - { requirement: action.recipient, value: reports@acme.com, span: reports@acme.com }
  "09:00":
    extractions:
      - { requirement: trigger.time, value: "09:00", span: "09:00" }
  "Monday":
    extractions:
      - { requirement: trigger.day_of_week, value: monday, span: Monday }
  "every item":
    extractions:
      - { requirement: filter.mode, value: all, span: every }
  "When an invoice arrives in Gmail, alert Slack":
    extractions:
      - { requirement: trigger, value: gmail_trigger, span: Gmail }
      - { requirement: action, value: slack_notify, span: Slack }
  "Label Finance, and only above ₹5,000":
    extractions:
      - { requirement: trigger.monitor_location, value: Finance, span: Label Finance }
      - { requirement: filter.mode, value: filtered, span: only above }
      - { requirement: filter.field, value: amount, span: "₹" }
      - { requirement: filter.operator, value: gt, span: above }
      - { requirement: filter.value, value: "5000", span: "₹5,000" }
  "#ap-alerts":
