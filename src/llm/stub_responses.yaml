question:
  trigger:
    ask: Which platform receives the {item}?
    ask_generic: What should start this workflow?
    rephrase: "I need to know what starts this workflow. For example: Gmail, Google Sheets, Stripe, a webhook, or a schedule."
  trigger.monitor_location:gmail_trigger:
    ask: Which Gmail label or folder should I monitor?
    rephrase: "Which Gmail label should I watch? For example: Finance, Inbox, or Invoices."
  trigger.monitor_location:outlook_trigger:
    ask: Which Outlook folder should I monitor?
    rephrase: "Which Outlook folder should I watch? For example: Inbox or Invoices."
  trigger.path:
    ask: Which URL path should the webhook listen on?
    rephrase: "Please give me the webhook path, for example /invoices."
  trigger.frequency:
    ask: How often should the workflow run?
    rephrase: "Please pick one: hourly, daily, or weekly."
  trigger.time:
    ask: What time of day should it run?
    rephrase: "Please give me a time, for example 09:00."
  trigger.day_of_week:
    ask: Which day of the week should it run?
    rephrase: "Please name a day, Monday to Sunday."
  filter.mode:
    ask: Should every {item} trigger the workflow, or only {items} above a certain amount?
    ask_generic: Should the workflow run every time, or only when a condition is met, such as an amount above a limit?
    rephrase: "Should I act on every item, or only on items that match a condition (for example, an amount above a limit)?"
  filter.field:
    ask: Which field should the condition check?
    rephrase: "Please pick the field to check: amount, subject, or sender."
  filter.operator:
    ask: How should that value be compared?
    rephrase: "Please pick a comparison: above, below, equal to, or contains."
  filter.value:
    ask: Which value should I compare against?
    rephrase: "Please give me the exact value, for example 10,000."
  action:
    ask: Where should the notification be sent?
    rephrase: "Please pick where the result goes, for example: Slack, email, Microsoft Teams, Google Sheets, or Jira."
  action.channel:
    ask: Which Slack workspace and channel?
    rephrase: "Which Slack channel should I post in? For example: #finance."
  action.recipient:
    ask: Which email address should receive the notification?
    rephrase: "Please give me the full email address, for example finance@company.com."
  action.url:
    ask: Which URL should the request be sent to?
    rephrase: "Please give me the full URL, starting with https://."
  action.method:
    ask: Which HTTP method should the request use?
    rephrase: "Please pick one: GET, POST, or PUT."
  dedupe.enabled:
    ask: Should duplicate {items} be ignored?
    ask_generic: Should duplicates be ignored?
    rephrase: "If the same item arrives twice, should I skip the second one? Yes or no."
  # ---------------------------------------------- apps beyond the reference
  trigger.spreadsheet:
    ask: Which Google Sheets spreadsheet should I watch for new rows?
    rephrase: "Please give me the spreadsheet's name, for example: Leads 2026."
  trigger.workbook:
    ask: Which Excel workbook should I watch for new rows?
    rephrase: "Please give me the workbook's name, for example: Sales Tracker."
  trigger.form:google_forms_trigger:
    ask: Which Google Form should I watch for new responses?
    rephrase: "Please give me the form's title, for example: Customer survey."
  trigger.form:typeform_trigger:
    ask: Which Typeform form should I watch for new responses?
    rephrase: "Please give me the form's title, for example: Customer survey."
  trigger.chat:
    ask: Which Telegram chat or bot should I listen to?
    rephrase: "Please give me the bot's username or the chat name, for example: @acme_support_bot."
  trigger.folder:
    ask: Which Google Drive folder should I watch for new files?
    rephrase: "Please give me the folder's name, for example: Invoices."
  trigger.calendar:
    ask: Which Google Calendar should I watch for new events?
    rephrase: "Please name the calendar, for example: Team meetings."
  trigger.event:stripe_trigger:
    ask: Which Stripe event should start the workflow?
    rephrase: "Please pick one: payment succeeded, payment failed, invoice paid, subscription created, or subscription cancelled."
  trigger.event:shopify_trigger:
    ask: Which Shopify event should start the workflow?
    rephrase: "Please pick one: a new order, a paid order, a new customer, or a product update."
  trigger.event:github_trigger:
    ask: Which GitHub event should start the workflow?
    rephrase: "Please pick one: a push, a pull request, an issue, or a release."
  trigger.repository:
    ask: Which GitHub repository should I watch?
    rephrase: "Please give me the repository as owner/name, for example: acme/webapp."
  trigger.feed_url:
    ask: Which RSS feed should I watch?
    rephrase: "Please give me the feed's full URL, starting with https://."
  action.team:
    ask: Which Microsoft Teams team and channel?
    rephrase: "Which team should I post in? For example: Sales."
  action.channel:teams_notify:
    ask: Which Teams channel should I post in?
    rephrase: "Please name the channel, for example: General."
  action.channel:discord_notify:
    ask: Which Discord channel should I post in?
