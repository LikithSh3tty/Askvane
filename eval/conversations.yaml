# Scripted conversations for the accuracy harness.
#
# Written before any prompt was tuned. Each conversation is the user's side
# only, in the order the agent is expected to ask. `expected` is every value
# that should be filled at the end, keyed by requirement id; `complete` says
# whether a workflow should be produced; `declined` says whether the agent
# should have refused something the catalog cannot express.

- id: c01_reference
  category: straightforward
  turns:
    - Whenever a new invoice arrives, notify my finance team.
    - Gmail
    - Finance
    - Only above ₹10,000
    - Slack
    - "#finance channel"
    - "Yes"
  complete: true
  expected:
    trigger: gmail_trigger
    trigger.monitor_location: Finance
    filter.mode: filtered
    filter.field: amount
    filter.operator: gt
    filter.value: 10000
    action: slack_notify
    action.channel: "#finance"
    dedupe.enabled: true

